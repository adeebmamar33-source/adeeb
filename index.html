<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Janoudi Outlet - الجانودي أوتلت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20">

  <!-- Header -->
  <header class="bg-black text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div>
      <h1 class="text-xl font-bold tracking-wider">AL-JANOUDI OUTLET</h1>
      <p class="text-xs text-gray-400">اللاذقية - الصليبة | أحذية أصلية 100%</p>
    </div>
    <button id="adminLoginBtn" onclick="toggleAdminModal()" class="bg-neutral-800 hover:bg-neutral-700 text-xs px-3 py-2 rounded-lg border border-neutral-700">
      <i class="fa-solid fa-user-shield ml-1"></i> دخول الأدمن
    </button>
  </header>

  <!-- Admin Toolbar (Visble only when logged in) -->
  <div id="adminPanel" class="hidden bg-amber-500 text-black p-3 font-semibold flex justify-between items-center px-4 shadow-md">
    <span><i class="fa-solid fa-lock-open ml-2"></i> وضع الأدمن مفعّل (الصلاحيات الكاملة)</span>
    <div class="space-x-2 space-x-reverse">
      <button onclick="openAddProductModal()" class="bg-black text-white text-xs px-3 py-1.5 rounded hover:bg-gray-800">
        <i class="fa-solid fa-plus ml-1"></i> إضافة منتج جديد
      </button>
      <button onclick="logoutAdmin()" class="bg-red-700 text-white text-xs px-2 py-1.5 rounded">خروج</button>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4">
    
    <!-- Brand Filter Header -->
    <div class="mb-6 overflow-x-auto whitespace-nowrap pb-2 flex gap-2">
      <button onclick="filterBrand('ALL')" class="bg-black text-white px-4 py-1.5 rounded-full text-sm">الكل</button>
      <button onclick="filterBrand('Nike')" class="bg-white border px-4 py-1.5 rounded-full text-sm">Nike</button>
      <button onclick="filterBrand('Adidas')" class="bg-white border px-4 py-1.5 rounded-full text-sm">Adidas</button>
      <button onclick="filterBrand('Puma')" class="bg-white border px-4 py-1.5 rounded-full text-sm">Puma</button>
      <button onclick="filterBrand('Asics')" class="bg-white border px-4 py-1.5 rounded-full text-sm">Asics</button>
    </div>

    <!-- Product Grid -->
    <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <!-- المنتجات تظهر هنا تلقائياً -->
    </div>
  </main>

  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/963981057508" target="_blank" class="fixed bottom-5 right-5 bg-green-500 text-white p-4 rounded-full shadow-2xl hover:bg-green-600 transition flex items-center justify-center z-50">
    <i class="fa-brands fa-whatsapp text-3xl"></i>
  </a>

  <!-- Modal: Admin Password Login -->
  <div id="loginModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="text-lg font-bold mb-4 text-center">تسجيل دخول الأدمن</h3>
      <input type="password" id="adminPassword" placeholder="أدخل كلمة السر (افتراضي 123456)" class="w-full border p-2 rounded mb-4 text-center">
      <div class="flex gap-2">
        <button onclick="loginAdmin()" class="bg-black text-white w-full py-2 rounded">دخول</button>
        <button onclick="toggleAdminModal()" class="bg-gray-200 w-full py-2 rounded">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add / Edit Product -->
  <div id="productModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl my-8">
      <h3 id="modalTitle" class="text-lg font-bold mb-4">إضافة حذاء جديد</h3>
      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="prodId">
        <label class="block text-xs font-bold mb-1">اسم الحذاء:</label>
        <input type="text" id="prodName" required class="w-full border p-2 rounded mb-3 text-sm">
        
        <label class="block text-xs font-bold mb-1">الماركة:</label>
        <select id="prodBrand" class="w-full border p-2 rounded mb-3 text-sm">
          <option value="Nike">Nike</option>
          <option value="Adidas">Adidas</option>
          <option value="Puma">Puma</option>
          <option value="Asics">Asics</option>
          <option value="Skechers">Skechers</option>
          <option value="Other">ماركة أخرى</option>
        </select>

        <label class="block text-xs font-bold mb-1">السعر ($):</label>
        <input type="number" id="prodPrice" required class="w-full border p-2 rounded mb-3 text-sm">

        <label class="block text-xs font-bold mb-1">المقاسات المتاحة (افصل بينها بفاصلة):</label>
        <input type="text" id="prodSizes" placeholder="40, 41, 42, 43" required class="w-full border p-2 rounded mb-3 text-sm">

        <label class="block text-xs font-bold mb-1">رابط صورة الحذاء:</label>
        <input type="url" id="prodImage" placeholder="https://..." required class="w-full border p-2 rounded mb-4 text-sm">

        <div class="flex gap-2">
          <button type="submit" class="bg-green-600 text-white w-full py-2 rounded font-bold">حفظ المنتج</button>
          <button type="button" onclick="closeProductModal()" class="bg-gray-200 w-full py-2 rounded">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. Initial Sample Products Data
    let defaultProducts = [
      { id: 1, name: "Air Max Plus", brand: "Nike", price: 175, sizes: ["41", "42", "43"], image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" },
      { id: 2, name: "Kayano 14", brand: "Asics", price: 135, sizes: ["40", "42", "44"], image: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500" }
    ];

    // Load from Local Storage if available
    let products = JSON.parse(localStorage.getItem('janoudi_products')) || defaultProducts;
    let isAdmin = localStorage.getItem('janoudi_admin') === 'true';

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      updateAdminUI();
      renderProducts(products);
    });

    // Render Products Grid
    function renderProducts(items) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      items.forEach(p => {
        const sizesHTML = p.sizes.map(s => `<span class="inline-block border px-1.5 py-0.5 text-xs rounded mr-1">${s}</span>`).join('');
        const adminControls = isAdmin ? `
          <div class="mt-2 pt-2 border-t flex justify-between gap-1">
            <button onclick="editProduct(${p.id})" class="bg-blue-600 text-white text-xs px-2 py-1 rounded w-full"><i class="fa-solid fa-pen"></i> تعديل</button>
            <button onclick="deleteProduct(${p.id})" class="bg-red-600 text-white text-xs px-2 py-1 rounded w-full"><i class="fa-solid fa-trash"></i> حذف</button>
          </div>
        ` : '';

        grid.innerHTML += `
          <div class="bg-white p-3 rounded-xl shadow-sm border relative flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">${p.brand}</span>
              <img src="${p.image}" class="w-full h-36 object-contain my-2 rounded-lg" alt="${p.name}">
              <h3 class="font-bold text-sm text-gray-800">${p.name}</h3>
              <p class="text-green-700 font-extrabold text-base my-1">$${p.price}</p>
              <div class="text-xs text-gray-500 mb-2">المقاسات: ${sizesHTML}</div>
            </div>
            <div>
              <a href="https://wa.me/963981057508?text=مرحبا،%20حابب%20استفسر%20عن%20${encodeURIComponent(p.name)}" 
                 target="_blank" class="block w-full text-center bg-black text-white text-xs py-2 rounded-lg font-bold">
                 طلب عبر الواتساب
              </a>
              ${adminControls}
            </div>
          </div>
        `;
      });
    }

    // Filter Brands
    function filterBrand(brand) {
      if (brand === 'ALL') renderProducts(products);
      else renderProducts(products.filter(p => p.brand.toLowerCase() === brand.toLowerCase()));
    }

    // Admin Auth Logic
    function toggleAdminModal() {
      document.getElementById('loginModal').classList.toggle('hidden');
      document.getElementById('loginModal').classList.toggle('flex');
    }

    function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === '123456') { // كلمة السر الخاصة بك
        isAdmin = true;
        localStorage.setItem('janoudi_admin', 'true');
        updateAdminUI();
        toggleAdminModal();
        renderProducts(products);
      } else {
        alert('كلمة السر خاطئة!');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.removeItem('janoudi_admin');
      updateAdminUI();
      renderProducts(products);
    }

    function updateAdminUI() {
      document.getElementById('adminPanel').classList.toggle('hidden', !isAdmin);
    }

    // Product CRUD
    function openAddProductModal() {
      document.getElementById('modalTitle').innerText = 'إضافة حذاء جديد';
      document.getElementById('productForm').reset();
      document.getElementById('prodId').value = '';
      document.getElementById('productModal').classList.remove('hidden');
      document.getElementById('productModal').classList.add('flex');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
      document.getElementById('productModal').classList.remove('flex');
    }

    function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('prodId').value;
      const newProd = {
        id: id ? parseInt(id) : Date.now(),
        name: document.getElementById('prodName').value,
        brand: document.getElementById('prodBrand').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        sizes: document.getElementById('prodSizes').value.split(',').map(s => s.trim()),
        image: document.getElementById('prodImage').value
      };

      if (id) {
        products = products.map(p => p.id === parseInt(id) ? newProd : p);
      } else {
        products.push(newProd);
      }

      localStorage.setItem('janoudi_products', JSON.stringify(products));
      renderProducts(products);
      closeProductModal();
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;
      document.getElementById('modalTitle').innerText = 'تعديل الحذاء';
      document.getElementById('prodId').value = p.id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodBrand').value = p.brand;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodSizes').value = p.sizes.join(', ');
      document.getElementById('prodImage').value = p.image;
      document.getElementById('productModal').classList.remove('hidden');
      document.getElementById('productModal').classList.add('flex');
    }

    function deleteProduct(id) {
      if (confirm('هل أنت تأكد من حذف هذا الحذاء؟')) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('janoudi_products', JSON.stringify(products));
        renderProducts(products);
      }
    }
  </script>
</body>
</html>
